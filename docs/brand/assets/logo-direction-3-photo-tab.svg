<?xml version="1.0" encoding="UTF-8"?>
<!--
  Direction 3: Photo Tab.
  Reads as a Polaroid / photo strip with a lens dot. Squircle frame + the chunky
  bottom border of a printed photo. Most product-literal of the three. Works as
  both an app icon and a favicon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>TinyBooth Logo - Direction 3: Photo Tab</title>
  <!-- Outer squircle frame -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="#F4EAD8"/>
  <!-- Photo viewport (slightly offset upward to leave a chunky bottom border like a Polaroid) -->
  <rect x="80" y="80" width="352" height="288" rx="40" ry="40" fill="#1F2937"/>
  <!-- Lens / subject -->
  <circle cx="256" cy="224" r="76" fill="#F4EAD8"/>
  <circle cx="256" cy="224" r="40" fill="#E85D5D"/>
  <!-- Tiny shutter highlight -->
  <circle cx="232" cy="200" r="12" fill="#F4EAD8"/>
</svg>
