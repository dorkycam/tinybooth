<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220">
  <title>TinyBooth Palette - Light</title>
  <style>
    .lbl { font: 600 13px -apple-system, "Inter", sans-serif; fill: #1F2937; }
    .hex { font: 500 11px ui-monospace, "SF Mono", monospace; fill: #1F2937; }
  </style>
  <rect width="720" height="220" fill="#FBF7EE"/>
  <!-- Ink -->
  <rect x="20"  y="20" width="100" height="140" rx="14" fill="#1F2937"/>
  <text x="20"  y="178" class="lbl">Ink</text>
  <text x="20"  y="195" class="hex">#1F2937</text>
  <!-- Cream -->
  <rect x="140" y="20" width="100" height="140" rx="14" fill="#F4EAD8" stroke="#E2D7C0"/>
  <text x="140" y="178" class="lbl">Cream</text>
  <text x="140" y="195" class="hex">#F4EAD8</text>
  <!-- Coral -->
  <rect x="260" y="20" width="100" height="140" rx="14" fill="#E85D5D"/>
  <text x="260" y="178" class="lbl">Coral</text>
  <text x="260" y="195" class="hex">#E85D5D</text>
  <!-- Mint (heritage) -->
  <rect x="380" y="20" width="100" height="140" rx="14" fill="#5FBFA6"/>
  <text x="380" y="178" class="lbl">Mint</text>
  <text x="380" y="195" class="hex">#5FBFA6</text>
  <!-- Lilac (heritage) -->
  <rect x="500" y="20" width="100" height="140" rx="14" fill="#B488D6"/>
  <text x="500" y="178" class="lbl">Lilac</text>
  <text x="500" y="195" class="hex">#B488D6</text>
  <!-- Stone -->
  <rect x="620" y="20" width="80"  height="140" rx="14" fill="#E5E0D5"/>
  <text x="620" y="178" class="lbl">Stone</text>
  <text x="620" y="195" class="hex">#E5E0D5</text>
</svg>
