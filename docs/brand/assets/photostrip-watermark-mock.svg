<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mock of a 1x4 classic photostrip with the free-tier watermark.
  Strip dimensions are 2:6 (e.g. 600 x 1800 px export).
  Cream border with "tinybooth" wordmark + lens dot in the bottom 14% of the strip.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1800" width="300" height="900">
  <title>TinyBooth Photostrip - Free Tier Watermark</title>
  <defs>
    <linearGradient id="ph1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9AB4C7"/>
      <stop offset="1" stop-color="#5C7A91"/>
    </linearGradient>
    <linearGradient id="ph2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8A48F"/>
      <stop offset="1" stop-color="#A56B59"/>
    </linearGradient>
    <linearGradient id="ph3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B0C9A8"/>
      <stop offset="1" stop-color="#6E8A78"/>
    </linearGradient>
    <linearGradient id="ph4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8B6D9"/>
      <stop offset="1" stop-color="#7E6B91"/>
    </linearGradient>
  </defs>
  <!-- Cream paper -->
  <rect width="600" height="1800" fill="#F4EAD8"/>
  <!-- 4 photos, 32px gutters, ~370 tall each -->
  <rect x="32"  y="32"   width="536" height="370" rx="6" fill="url(#ph1)"/>
  <rect x="32"  y="430"  width="536" height="370" rx="6" fill="url(#ph2)"/>
  <rect x="32"  y="828"  width="536" height="370" rx="6" fill="url(#ph3)"/>
  <rect x="32"  y="1226" width="536" height="370" rx="6" fill="url(#ph4)"/>
  <!-- Watermark zone: bottom ~190px -->
  <g transform="translate(300 1690)" text-anchor="middle">
    <!-- Lens dot to the left of wordmark -->
    <g transform="translate(-128 -22)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#1F2937" stroke-width="5"/>
      <circle cx="0" cy="0" r="9" fill="#1F2937"/>
    </g>
    <text x="6" y="-12" font-family="Manrope, -apple-system, sans-serif"
          font-weight="700" font-size="46" fill="#1F2937"
          letter-spacing="-1">tinybooth</text>
    <text x="0" y="32" font-family="Manrope, -apple-system, sans-serif"
          font-weight="500" font-size="22" fill="#1F2937" opacity="0.55"
          letter-spacing="2">TINYBOOTH.COM</text>
  </g>
</svg>
