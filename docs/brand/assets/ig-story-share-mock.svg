<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mock of the auto-generated 9:16 share image for Instagram / TikTok stories.
  1080 x 1920 export. Cream background, photo card centered, branding bottom-anchored.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="360" height="640">
  <title>TinyBooth IG Story Share - Free Tier</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EAD8"/>
      <stop offset="1" stop-color="#EAD9BC"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9AB4C7"/>
      <stop offset="1" stop-color="#5C7A91"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <!-- Photo card with slight tilt (Polaroid feel without being kitschy) -->
  <g transform="translate(540 880) rotate(-2.5) translate(-380 -480)">
    <rect width="760" height="960" rx="20" fill="#FFFFFF"/>
    <rect x="40" y="40" width="680" height="760" rx="8" fill="url(#photo)"/>
    <text x="380" y="900" text-anchor="middle"
          font-family="Caveat, cursive" font-size="56" fill="#1F2937">
      Sam's 30th
    </text>
  </g>
  <!-- Bottom branding -->
  <g transform="translate(540 1740)" text-anchor="middle">
    <g transform="translate(-156 -14)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#1F2937" stroke-width="6"/>
      <circle cx="0" cy="0" r="10" fill="#1F2937"/>
    </g>
    <text x="14" y="0" font-family="Manrope, -apple-system, sans-serif"
          font-weight="700" font-size="60" fill="#1F2937"
          letter-spacing="-1.5">tinybooth</text>
    <text x="0" y="56" font-family="Manrope, -apple-system, sans-serif"
          font-weight="500" font-size="26" fill="#1F2937" opacity="0.6"
          letter-spacing="3">MAKE YOUR OWN AT TINYBOOTH.COM</text>
  </g>
</svg>
