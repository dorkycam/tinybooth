<?xml version="1.0" encoding="UTF-8"?>
<!--
  Direction 1: Aperture Squircle.
  Keeps the squircle silhouette and lens-in-square arrangement of the original.
  Refresh: tighter superellipse, no inner ring, single-stroke aperture mark
  inside the lens, flatter color, no glossy highlight.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>TinyBooth Logo - Direction 1: Aperture Squircle</title>
  <!-- Squircle background (superellipse-ish via rounded rect with large radius) -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="#1F2937"/>
  <!-- Lens body -->
  <circle cx="256" cy="256" r="148" fill="#F4EAD8"/>
  <!-- Aperture mark: 6 thin blades -->
  <g stroke="#1F2937" stroke-width="14" stroke-linecap="round" fill="none">
    <line x1="256" y1="148" x2="256" y2="208"/>
    <line x1="350" y1="202" x2="298" y2="232"/>
    <line x1="350" y1="310" x2="298" y2="280"/>
    <line x1="256" y1="364" x2="256" y2="304"/>
    <line x1="162" y1="310" x2="214" y2="280"/>
    <line x1="162" y1="202" x2="214" y2="232"/>
  </g>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="22" fill="#E85D5D"/>
</svg>
