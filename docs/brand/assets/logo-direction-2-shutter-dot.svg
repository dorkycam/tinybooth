<?xml version="1.0" encoding="UTF-8"?>
<!--
  Direction 2: Shutter Dot.
  Drops the squircle frame entirely. The mark IS a lens with a single offset
  highlight dot, derived from the comma-shape in the original. Reads at 16px.
  Most modern of the three. Closest to a Linear/Vercel-tier minimal mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>TinyBooth Logo - Direction 2: Shutter Dot</title>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#1F2937" stroke-width="36"/>
  <!-- Inner solid lens -->
  <circle cx="256" cy="256" r="120" fill="#1F2937"/>
  <!-- Highlight dot (offset upper-left, derived from original comma reflection) -->
  <circle cx="206" cy="206" r="34" fill="#F4EAD8"/>
</svg>
