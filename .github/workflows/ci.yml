# Runs on every PR and push. Mobile builds and Vercel deploys handled by
# separate workflows added in Phase 4.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build

      - name: Coverage summary (web)
        run: pnpm --filter @tinybooth/web test:coverage 2>&1 | tail -40
        continue-on-error: true

      - name: Coverage summary (billing)
        run: pnpm --filter @tinybooth/billing test:coverage 2>&1 | tail -20
        continue-on-error: true
