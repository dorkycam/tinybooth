# Web deploy gate.
#
# Vercel auto-deploys on every push to main and on every PR. This workflow
# does NOT call Vercel directly. Instead it waits for the existing CI job to
# pass, then publishes a "deploy-ok" status check that can be required in
# Vercel's deployment protection rules. If CI fails, the gate stays red and
# Vercel skips promotion.
#
# To wire this up in Vercel:
#   Project Settings -> Git -> Deployment Protection -> Require Status Check
#   -> select "deploy-ok".
#
# This pattern keeps Vercel's Edge Network deployments fast (no extra build
# step) while still gating on lint + typecheck + test from ci.yml.

name: web-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  await-ci:
    name: await CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          check-name: lint / typecheck / test / build
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  publish-ok:
    name: deploy-ok
    needs: await-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark deploy-ok
        run: |
          echo "CI passed for ${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Vercel deployment protection can promote this commit."
