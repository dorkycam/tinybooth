# Build + submit to the stores. Maintainer-only by design.
#
# Triggers ONLY on:
#   - workflow_dispatch (you click Run, pick the profile)
#   - tag push matching v* (created by release-please when you merge a release PR)
# It never runs on a normal branch push or a PR, so a stray commit or a fork can't
# trigger a build or a submission.
#
# Gate it further with a GitHub Environment named "release" that requires your review
# (Settings > Environments > release > required reviewers). Then nothing builds until
# you approve, even on a tag.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   EXPO_TOKEN                     EAS access token (expo.dev account settings)
#   ASC_API_KEY_ID                App Store Connect API key id
#   ASC_API_KEY_ISSUER_ID         App Store Connect API key issuer id
#   ASC_API_KEY_BASE64            base64 of the .p8 App Store Connect API key
#   ANDROID_SERVICE_ACCOUNT_JSON  contents of the Play service-account JSON
name: build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS profile"
        required: true
        default: preview
        type: choice
        options: [preview, production]
      submit:
        description: "Submit to TestFlight + Play after build"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build + submit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROFILE: ${{ github.event.inputs.profile || 'production' }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # These two steps deliberately have no `if:`. The `secrets` context is not
      # available in an `if:` expression, and referencing it there makes the
      # whole workflow file unparseable, which in turn makes GitHub ignore the
      # `on:` filters and log a failed run for every push on every branch.
      #
      # Hoisting the secrets to the job-level `env:` would also "work", but it
      # would expose the Play and App Store credentials to every step in the
      # job, including `pnpm install` and its third-party postinstall scripts.
      # Keeping `env:` on the individual step and no-opping on an empty value
      # gets the same skip behaviour with the original blast radius.
      - name: Materialize Play service account
        env:
          PLAY_JSON: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "ANDROID_SERVICE_ACCOUNT_JSON not set, skipping."
            exit 0
          fi
          mkdir -p secrets
          printf '%s' "$PLAY_JSON" > secrets/play-service-account.json
          chmod 600 secrets/play-service-account.json

      - name: Materialize App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_B64" ]; then
            echo "ASC_API_KEY_BASE64 not set, skipping."
            exit 0
          fi
          mkdir -p secrets
          printf '%s' "$ASC_KEY_B64" | base64 --decode > secrets/asc-api-key.p8
          chmod 600 secrets/asc-api-key.p8

      - name: Build (both platforms)
        run: eas build --platform all --profile "$PROFILE" --non-interactive --message "ci $COMMIT_SHA"

      - name: Submit (both platforms)
        if: ${{ github.event.inputs.submit == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        run: eas submit --platform all --profile "$PROFILE" --non-interactive

      - name: Cleanup secrets
        if: always()
        run: rm -rf secrets
