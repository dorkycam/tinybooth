# Build + submit to the stores. Maintainer-only by design.
#
# Triggers ONLY on:
#   - workflow_dispatch (you click Run, pick the profile)
#   - tag push matching v* (created by release-please when you merge a release PR)
# It never runs on a normal branch push or a PR, so a stray commit or a fork can't
# trigger a build or a submission.
#
# Runs in a GitHub Environment chosen from the profile:
#   profile preview     -> `develop`     (TestFlight + Play internal)
#   profile production  -> `production`  (public store release)
#   tag push            -> `production`  (no inputs, so PROFILE defaults to production)
#
# Put required reviewers on `production` (Settings > Environments) so nothing reaches a
# public store without your approval, even on a tag.
#
# Required repo secret (Settings > Secrets and variables > Actions):
#   EXPO_TOKEN   EAS access token (expo.dev account settings)
#
# That is the only one. The App Store Connect API key and the Play service account are
# stored in EAS itself (`eas credentials`), so `eas submit` picks them up server-side and
# no private key is ever written to this runner's disk. See docs/release-setup.md.
name: build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS profile"
        required: true
        default: preview
        type: choice
        options: [preview, production]
      submit:
        description: "Submit to TestFlight + Play after build"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build + submit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ github.event.inputs.profile == 'preview' && 'develop' || 'production' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROFILE: ${{ github.event.inputs.profile || 'production' }}
      COMMIT_SHA: ${{ github.sha }}
      # True for a v* tag (a real release) or when a manual run opts in.
      SUBMIT: ${{ github.event.inputs.submit == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Submission happens via --auto-submit on the build, not as a separate
      # `eas submit` step. A standalone `eas submit --non-interactive` has no way to
      # know which archive to send and fails with "You need to specify the archive
      # source when running in non-interactive mode". --auto-submit ties the
      # submission to the exact build this invocation produced, rather than to
      # whatever happens to be the latest build on EAS.
      #
      # Store credentials come from EAS, so there is nothing to materialize on this
      # runner beforehand and nothing to clean up afterwards.
      - name: Build${{ github.event.inputs.submit == 'true' && ' and submit' || '' }} (both platforms)
        run: |
          if [ "$SUBMIT" = "true" ]; then
            eas build --platform all --profile "$PROFILE" --non-interactive \
              --message "ci $COMMIT_SHA" --auto-submit
          else
            eas build --platform all --profile "$PROFILE" --non-interactive \
              --message "ci $COMMIT_SHA"
          fi
