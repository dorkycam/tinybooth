# Build + submit to the stores. Maintainer-only by design.
#
# Triggers ONLY on:
#   - workflow_dispatch (you click Run, pick the profile)
#   - tag push matching v* (created by release-please when you merge a release PR)
# It never runs on a normal branch push or a PR, so a stray commit or a fork can't
# trigger a build or a submission.
#
# Runs in a GitHub Environment chosen from the profile:
#   profile preview     -> `develop`     (TestFlight + Play internal)
#   profile production  -> `production`  (public store release)
#   tag push            -> `production`  (no inputs, so PROFILE defaults to production)
#
# Put required reviewers on `production` (Settings > Environments) so nothing reaches a
# public store without your approval, even on a tag.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   EXPO_TOKEN                     EAS access token (expo.dev account settings)
#   ASC_API_KEY_BASE64            base64 of the .p8 App Store Connect API key
#   ANDROID_SERVICE_ACCOUNT_JSON  contents of the Play service-account JSON
#
# The App Store Connect key id and issuer id are identifiers, not secrets. They belong in
# eas.json. See docs/release-setup.md.
name: build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS profile"
        required: true
        default: preview
        type: choice
        options: [preview, production]
      submit:
        description: "Submit to TestFlight + Play after build"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build + submit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ github.event.inputs.profile == 'preview' && 'develop' || 'production' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROFILE: ${{ github.event.inputs.profile || 'production' }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Materialize Play service account
        if: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON != '' }}
        env:
          PLAY_JSON: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$PLAY_JSON" > secrets/play-service-account.json
          chmod 600 secrets/play-service-account.json

      - name: Materialize App Store Connect API key
        if: ${{ secrets.ASC_API_KEY_BASE64 != '' }}
        env:
          ASC_KEY_B64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p secrets
          printf '%s' "$ASC_KEY_B64" | base64 --decode > secrets/asc-api-key.p8
          chmod 600 secrets/asc-api-key.p8

      - name: Build (both platforms)
        run: eas build --platform all --profile "$PROFILE" --non-interactive --message "ci $COMMIT_SHA"

      - name: Submit (both platforms)
        if: ${{ github.event.inputs.submit == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        run: eas submit --platform all --profile "$PROFILE" --non-interactive

      - name: Cleanup secrets
        if: always()
        run: rm -rf secrets
