# Terraform plan on PRs that touch infra/.
#
# Runs `terraform fmt -check`, `terraform validate`, and `terraform plan`
# against both the staging and production environments and posts the plan
# diff as a sticky PR comment.
#
# Required GitHub secrets:
#   - AWS_ROLE_TO_ASSUME      OIDC role arn (configured in
#     infra/terraform/shared/github-oidc.tf)
#   - TF_BACKEND_BUCKET       S3 bucket holding the terraform state
#   - TF_BACKEND_LOCK_TABLE   DynamoDB table for state locks

name: infra-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-plan.yml"

concurrency:
  group: infra-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: plan ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.9.5
          terraform_wrapper: true

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_LOCK_TABLE }}" \
            -backend-config="key=tinybooth/${{ matrix.environment }}/terraform.tfstate"

      - name: Terraform validate
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > tfplan.txt

      - name: Comment plan on PR
        uses: marocchino/sticky-pull-request-comment@v2.9.0
        with:
          header: tf-plan-${{ matrix.environment }}
          path: infra/terraform/environments/${{ matrix.environment }}/tfplan.txt
