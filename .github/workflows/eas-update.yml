# OTA JS update for the mobile app.
#
# Triggered by pushes to main that touch apps/mobile/** but NOT the native
# project files (which require a real binary build via mobile-build.yml).
# Native files are excluded via paths-ignore so a touched ios/ or
# android/ directory does not silently ship through OTA when it requires a
# fresh build.
#
# Required GitHub secret: EXPO_TOKEN.

name: eas-update

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
    paths-ignore:
      - "apps/mobile/ios/**"
      - "apps/mobile/android/**"
      - "apps/mobile/app.json"
      - "apps/mobile/eas.json"
      - "apps/mobile/Gemfile"
      - "apps/mobile/Gemfile.lock"
      - "apps/mobile/fastlane/**"
  workflow_dispatch: {}

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: eas update --branch production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 9.15.0

      - name: Setup Node 20
        uses: actions/setup-node@v4.0.3
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/mobile
        run: |
          eas update \
            --branch production \
            --message "${{ github.event.head_commit.message || github.sha }}" \
            --non-interactive \
            --auto
