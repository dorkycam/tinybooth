# TinyWall data migration runner. Manual dispatch only.
#
# Default mode is dry-run. To actually write data, both of these must be set:
#   - The `confirm` input must be the literal string "true".
#   - The repository must have an org-level / env secret
#     `MIGRATE_TINYWALL=I_HAVE_BACKED_UP` set in the migration environment.
#
# The script `scripts/migrate-tinywall.ts` enforces both checks too. The
# workflow guards exist as a second safety net so an accidental dispatch
# cannot run a real migration even if the secret is set wrong.
#
# Required GitHub secrets (in the `migration` environment):
#   - MIGRATE_TINYWALL                    must equal "I_HAVE_BACKED_UP"
#   - SUPABASE_DATABASE_URL               target Supabase Postgres URL
#   - R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   - VERCEL_BLOB_LEGACY_TOKEN            read-only token for the old Blob store

name: migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'true' to disable dry-run. Anything else stays dry."
        required: true
        type: string
        default: "false"

permissions:
  contents: read

concurrency:
  group: migration-${{ github.event.inputs.confirm }}
  cancel-in-progress: false

jobs:
  migrate:
    name: tinywall migration (dry-run=${{ github.event.inputs.confirm != 'true' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: migration

    env:
      MIGRATE_TINYWALL: ${{ secrets.MIGRATE_TINYWALL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      VERCEL_BLOB_LEGACY_TOKEN: ${{ secrets.VERCEL_BLOB_LEGACY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 9.15.0

      - name: Setup Node 20
        uses: actions/setup-node@v4.0.3
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse confirm without the env safeguard
        if: ${{ github.event.inputs.confirm == 'true' }}
        run: |
          if [ "$MIGRATE_TINYWALL" != "I_HAVE_BACKED_UP" ]; then
            echo "::error::confirm=true requires MIGRATE_TINYWALL=I_HAVE_BACKED_UP."
            exit 1
          fi
          echo "Real migration confirmed. Proceeding."

      - name: Run migration (dry-run)
        if: ${{ github.event.inputs.confirm != 'true' }}
        working-directory: scripts
        run: pnpm exec tsx migrate-tinywall.ts

      - name: Run migration (real)
        if: ${{ github.event.inputs.confirm == 'true' }}
        working-directory: scripts
        run: pnpm exec tsx migrate-tinywall.ts --confirm
